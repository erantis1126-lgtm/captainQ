name: 안드로이드 테스트 앱 빌드

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # 테스트 APK를 릴리스에 올리기 위해

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 안드로이드 프로젝트 준비 (웹 복사, 위치 권한, 아이콘, 동기화)
        run: npm run android:prepare

      - name: 테스트용 APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: soldout-radar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 테스트 APK를 릴리스에 올리기 (폰에서 바로 받기용)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk soldout-radar-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build soldout-radar-test.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "품절템 레이더 테스트 앱 (최신)" \
            --notes "main 브랜치 최신 코드로 자동 빌드한 테스트용 APK예요. 스토어 출시용이 아니에요. 새 버전을 설치할 때는 이전 테스트 앱을 먼저 지워 주세요."
